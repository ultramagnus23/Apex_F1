name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python and dependencies (locked)
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (strict on apex/core)
        run: uv run mypy apex/core

      - name: Tests
        run: uv run pytest -m "not network" --cov=apex --cov-report=term-missing

      - name: Case study 01 reproduces from the committed fixture
        run: uv run python scripts/check_case_study.py
