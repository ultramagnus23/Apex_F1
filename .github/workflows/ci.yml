name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python and dependencies (locked)
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (strict on apex/core)
        run: uv run mypy apex/core

      - name: Tests
        run: uv run pytest -m "not network" --cov=apex --cov-report=term-missing

      - name: Case study 01 is reproducible (tables, gate and summary; PNGs excluded)
        run: |
          uv run python examples/case_study_01.py
          # Numeric-tolerant comparison: a byte-exact git diff fails on last-digit
          # floating-point differences between CPUs / BLAS builds.
          uv run python scripts/check_regenerated.py docs/case_study_01 --exclude '*.png'

      # actions/cache only saves when the whole job succeeds, so a rate-limited first
      # run could never persist its progress and every later run started from scratch.
      # Restore the newest partial cache, and save under a unique key even on failure.
      - name: Restore data cache
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: apex-data-${{ hashFiles('scripts/inspect_openf1_session.py') }}-11392-${{ github.run_id }}
          restore-keys: |
            apex-data-${{ hashFiles('scripts/inspect_openf1_session.py') }}-11392-
            apex-data-

      - name: Reproducible example (data contract evidence is regenerated identically)
        run: |
          # Every OpenF1 response is cached to disk as it arrives, so a retry resumes
          # where the previous attempt was rate-limited instead of starting over.
          for attempt in 1 2 3 4; do
            if uv run python scripts/inspect_openf1_session.py --session-key 11392 \
                 --season 2026 --round 18 --out /tmp/inspection_11392.json; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "::warning::OpenF1 fetch attempt ${attempt}/4 failed; retrying after backoff"
            sleep $((45 * attempt))
          done
          diff /tmp/inspection_11392.json docs/data/inspection_11392.json

      - name: Save data cache
        if: always() && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: apex-data-${{ hashFiles('scripts/inspect_openf1_session.py') }}-11392-${{ github.run_id }}
