[project]
name = "apex"
version = "0.1.0"
description = "Motorsport performance intelligence: reproducible, epistemically honest analysis of public F1 timing and telemetry."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Chaitanya" }]
dependencies = [
    "fastf1==3.9.0",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "scipy==1.18.1",
    "pyarrow==26.0.0",
    "pandera==0.35.0",
    "requests==2.34.2",
    "typer==0.27.3",
    "rich==15.0.0",
    "plotly==7.1.0",
    "matplotlib==3.11.2",
]

[project.scripts]
apex = "apex.cli:app"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-benchmark==5.3.0",
    "hypothesis==6.170.13",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
    "types-requests==2.33.0.20261006",
    "pre-commit==4.7.0",
]
docs = ["mkdocs-material==9.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apex"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/_scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD", "PT"]
# RUF001-003: Apex deliberately uses σ, −, –, Δ in user-facing text and docstrings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pep8-naming]
# L (lap/line length) and T (lap time) follow the maths in METHODOLOGY.md.
extend-ignore-names = ["L", "T"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apex.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs network access or a warm FastF1 cache (deselected in CI by default)",
]

[tool.coverage.run]
source = ["apex"]
branch = true
